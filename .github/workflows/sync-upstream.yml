name: Sync Upstream Custom

permissions:
  contents: write

on:
  # 每天 UTC 0点（北京时间早上8点）自动运行
  schedule:
    - cron: '0 0 * * *'
  # 允许你随时在网页上手动点击运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 这行 uses 是 GitHub 官方自带的，不需要改
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 下面的同步脚本，上游地址和分支我都帮你填好为 BootstrapBlazor/BootstrapBlazor.Extensions 的 main 分支了
      - name: Config git and run sync
        run: |
          git remote add upstream https://github.com/BootstrapBlazor/BootstrapBlazor.Extensions.git
          git fetch upstream
          git checkout master
          git merge upstream/master
          git push origin master
